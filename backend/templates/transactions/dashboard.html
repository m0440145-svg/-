<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><nav><a href="{% url 'transaction_create' %}">معاملة جديدة</a> | <a href="{% url 'export_csv' %}">تصدير CSV</a> | <a href="{% url 'logout' %}">خروج</a></nav><h1>لوحة المراسلات</h1><p>الإجمالي: {{ total }} | المتأخرة: {{ late }}</p><table><tr><th>الرقم</th><th>النوع</th><th>الموضوع</th><th>الجهة</th><th>القسم</th><th>الحالة</th></tr>{% for t in transactions %}<tr><td><a href="{% url 'detail' t.pk %}">{{ t.reference }}</a></td><td>{{ t.get_kind_display }}</td><td>{{ t.subject }}</td><td>{{ t.entity }}</td><td>{{ t.department }}</td><td>{{ t.get_status_display }}</td></tr>{% endfor %}</table></html>
