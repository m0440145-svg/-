server {
 listen 80;
 server_name morasalat.example.sa;
 client_max_body_size 10M;
 location /static/ { alias /srv/morasalat/backend/staticfiles/; }
 location / { proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://127.0.0.1:8000; }
}
